<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adélaïde & Victor</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=Montserrat:wght@400&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: #fff;
            color: #8B1A1A;
        }

        .page {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: #fff;
            padding: 40px;
            text-align: center;
        }

        h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 80px;
            font-weight: 300;
            letter-spacing: 4px;
            margin-bottom: 10px;
            color: #8B1A1A;
        }

        h2 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 70px;
            font-weight: 300;
            font-style: italic;
            margin-bottom: 60px;
            color: #8B1A1A;
        }

        .names {
            font-family: 'Cormorant Garamond', serif;
            font-size: 32px;
            letter-spacing: 2px;
            margin: 60px 0 30px;
            font-weight: 400;
        }

        .footer {
            font-size: 12px;
            letter-spacing: 2px;
            color: #8B1A1A;
        }

        .icon {
            width: 100px;
            height: 100px;
            margin: 40px 0;
        }
    </style>
</head>
<body>
    <div class="page">
        <h1>SAVE</h1>
        <h2>the DATE</h2>

        <svg class="icon" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <path d="M50 10 L55 25 Q50 30 45 25 Z" stroke="#8B1A1A" fill="none" stroke-width="1.5"/>
            <circle cx="50" cy="35" r="10" stroke="#8B1A1A" fill="none" stroke-width="1.5"/>
            <line x1="50" y1="45" x2="50" y2="70" stroke="#8B1A1A" stroke-width="1.5"/>
            <line x1="40" y1="48" x2="35" y2="65" stroke="#8B1A1A" stroke-width="1.5"/>
            <line x1="60" y1="48" x2="65" y2="65" stroke="#8B1A1A" stroke-width="1.5"/>
        </svg>

        <p class="names">Adélaïde & Victor</p>
        <p class="footer">INVITATION À SUIVRE</p>
    </div>
</body>
</html>
